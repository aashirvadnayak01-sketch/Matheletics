<style>

/* buttons */

.btn:active{transform:scale(.97)}
.btn-cobalt{background:var(--cobalt);color:var(--ivory);box-shadow:0 10px 28px -10px color-mix(in srgb,var(--cobalt) 80%,transparent)}

/* reveal */
.rv{transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0s)}
/* hidden state applies only while JS is running AND the element has not been revealed yet.
   (:not(.in) matters: a plain ".rv.in" rule is less specific than ".rv.fx.r" and would never win.) */
.js .rv:not(.in){opacity:0;transform:translateY(28px)}
.js .rv.fx:not(.in){transform:translateX(-40px)}
.js .rv.fx.r:not(.in){transform:translateX(40px)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes fadeup{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes drop{0%{transform:translateY(0);opacity:1}60%{transform:translateY(16px);opacity:.3}100%{transform:translateY(0);opacity:1}}
.spin-slow{animation:spin 60s linear infinite}.spin-slower{animation:spinr 120s linear infinite}

.slide{position:relative;border-radius:2rem;background:var(--ivory);padding:2rem;box-shadow:0 30px 60px -34px rgba(23,43,103,.6),0 0 0 1px rgba(23,43,103,.1);touch-action:pan-y;cursor:grab;animation:slidein .35s ease both;user-select:none}

@keyframes slidein-r{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}

.slide .av{display:grid;place-items:center;width:2.75rem;height:2.75rem;border-radius:50%;background:var(--cobalt);font-family:var(--display);font-weight:700;color:var(--ivory)}
.slide figure{margin:0}
.slide .nm{display:block;font-family:var(--display);font-weight:700;color:var(--royal)}.slide .rl{font-size:.875rem;color:rgba(16,26,53,.6)}
.carnav{margin-top:2rem;display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:.5rem}.dots button{display:grid;place-items:center;width:1.5rem;height:1.5rem}

.arrows{display:flex;gap:.75rem}

/* admission */

.checks{margin-top:2rem;display:grid;gap:.75rem;color:rgba(16,26,53,.75)}
.checks li{display:flex;align-items:flex-start;gap:.75rem}
.checks i{display:grid;place-items:center;width:1.25rem;height:1.25rem;margin-top:.25rem;flex-shrink:0;border-radius:50%;background:var(--mint);color:var(--royal)}
.fbox{border-radius:2rem;background:var(--ivory);padding:1.25rem;box-shadow:0 40px 80px -40px rgba(23,43,103,.55),0 0 0 1px rgba(23,43,103,.1)}
@media(min-width:640px){.fbox{padding:2.25rem}}
.steps{margin-bottom:2rem;display:flex;align-items:center}
.steps li{display:flex;flex:1;align-items:center}.steps li:last-child{flex:none}
.steps .st{display:flex;flex-direction:column;align-items:center;gap:.375rem}
.steps .c{display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:50%;background:var(--lavender);color:rgba(23,43,103,.5);font-family:var(--display);font-size:.875rem;font-weight:700;transition:background .3s}
@media(min-width:640px){.steps .c{width:2.5rem;height:2.5rem}}
.steps li.done .c{background:var(--mint);color:var(--royal)}.steps li.cur .c{background:var(--cobalt);color:var(--ivory)}
.steps .l{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(16,26,53,.45)}@media(min-width:640px){.steps .l{font-size:.75rem}}
.steps li.cur .l{color:var(--cobalt)}
.steps .bar{position:relative;flex:1;height:3px;margin:0 .5rem 1.25rem;overflow:hidden;border-radius:9999px;background:var(--lavender)}
.steps .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--tangerine);transition:width .4s}
.steps li.done .bar i{width:100%}
.fstep{display:grid;gap:1.25rem;animation:fin .25s ease both}
.fstep.back{animation-name:fin-b}
@keyframes fin{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes fin-b{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.fstep h3{font-size:1.5rem;font-weight:700;color:var(--royal)}
.fld.err{animation:shake .4s}
.fld label,.fld .lg{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;font-family:var(--display);font-size:.875rem;font-weight:700;color:var(--royal)}
.req{color:var(--tangerine)}.opt{font-size:.75rem;font-weight:600;color:rgba(16,26,53,.5)}
.inp{display:block;min-height:3.25rem;width:100%;border:2px solid rgba(23,43,103,.15);border-radius:1rem;background:var(--ivory);padding:.75rem 1rem;font:inherit;font-size:1rem;color:var(--midnight);outline:none;transition:border-color .2s,box-shadow .2s}
.inp::placeholder{color:rgba(16,26,53,.35)}.inp:hover{border-color:rgba(23,43,103,.3)}
.inp:focus{border-color:var(--cobalt);box-shadow:0 0 0 4px rgba(49,95,232,.15)}
.inp[aria-invalid=true]{border-color:var(--danger)}
textarea.inp{resize:vertical;min-height:7rem}
.hint{margin-top:.375rem;font-size:.75rem;color:rgba(16,26,53,.55)}
.em{margin-top:.375rem;font-size:.875rem;font-weight:600;color:var(--danger)}
.em:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{min-height:3rem;border:2px solid rgba(23,43,103,.2);border-radius:9999px;background:var(--ivory);padding:0 1.25rem;font-family:var(--display);font-size:.875rem;font-weight:700;color:var(--royal);transition:all .2s}
.chip:hover{border-color:var(--cobalt)}.chip[aria-checked=true]{border-color:var(--cobalt);background:var(--cobalt);color:var(--ivory)}
.fnav{margin-top:2rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.review{border-radius:1rem;background:rgba(233,229,255,.5);padding:0 1.25rem;font-size:.875rem}
.review div{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 0;border-top:1px solid rgba(23,43,103,.1)}.review div:first-child{border:0}
.review dt{font-weight:600;color:rgba(16,26,53,.55)}.review dd{margin:0;word-break:break-all;text-align:right;font-weight:700;color:var(--royal)}
.consent{display:flex;cursor:pointer;align-items:flex-start;gap:.75rem;border:2px solid rgba(23,43,103,.15);border-radius:1rem;padding:1rem;font-size:.875rem;line-height:1.6;color:rgba(16,26,53,.8)}

.notice{border-radius:1rem;padding:1rem;font-size:.875rem;font-weight:600;color:var(--royal);background:rgba(255,128,87,.2)}
.notice.bad{border:2px solid var(--danger);background:rgba(194,65,12,.1);color:var(--danger-d)}
.pchip{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1.25rem;border-radius:1rem;background:var(--lavender);padding:.75rem 1rem;font-size:.875rem;font-weight:600;color:var(--royal)}
.pchip button{color:var(--cobalt);text-decoration:underline}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.spinner{display:inline-block;width:1rem;height:1rem;border:2px solid var(--midnight);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.success{padding:1.5rem 0;text-align:center;animation:fadeup .5s ease both}
.success .tick{display:grid;place-items:center;width:5rem;height:5rem;margin:0 auto 1.5rem;border-radius:50%;background:var(--mint);color:var(--royal);animation:pop .6s cubic-bezier(.3,1.7,.5,1) .1s both}
.success h3{font-size:clamp(1.875rem,4vw,2.25rem);font-weight:700;color:var(--royal)}
.success .m{margin:1rem auto 0;max-width:28rem;font-size:1.125rem;color:rgba(16,26,53,.75)}
.success .id{margin:1.75rem auto 0;max-width:24rem;border-radius:1rem;background:var(--lavender);padding:1.25rem}
.success .id .eyebrow{font-size:.65rem;color:var(--cobalt);margin:0}
.success .id b{display:block;margin-top:.25rem;font-family:var(--display);font-size:1.5rem;letter-spacing:.05em;color:var(--royal);user-select:all}
.success .id small{display:block;margin-top:.25rem;font-size:.75rem;color:rgba(16,26,53,.6)}

/* faq */
.faq{display:grid;gap:3rem}@media(min-width:1024px){.faq{grid-template-columns:.8fr 1.2fr}}
.acc{border-block:1px solid rgba(23,43,103,.15)}.acc>div+div{border-top:1px solid rgba(23,43,103,.15)}
.acc button.q{display:flex;min-height:4rem;width:100%;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 0;text-align:left;font-family:var(--display);font-size:clamp(1.1rem,2vw,1.25rem);font-weight:700;color:var(--royal)}
.acc .pl{display:grid;place-items:center;width:2.25rem;height:2.25rem;flex-shrink:0;border-radius:50%;background:var(--lavender);font-size:1.25rem;transition:transform .3s,background .3s}
.acc button[aria-expanded=true] .pl{transform:rotate(45deg);background:var(--tangerine)}
.acc .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc .ans.open{grid-template-rows:1fr}.acc .ans>div{overflow:hidden}
.acc .ans p{padding:0 3rem 1.5rem 0;font-size:1.125rem;line-height:1.6;color:rgba(16,26,53,.7)}

/* final cta */
.finalwrap{padding:0 .75rem 4rem}@media(min-width:640px){.finalwrap{padding:0 1.5rem 6rem}}
.final{position:relative;max-width:80rem;margin:0 auto;overflow:hidden;border-radius:2.2rem;background:linear-gradient(135deg,var(--cobalt),#3a52d6 50%,var(--royal));padding:5rem 1.5rem;text-align:center;color:var(--ivory)}
@media(min-width:640px){.final{border-radius:3rem;padding:7rem 3rem}}
.final .g1{position:absolute;left:-4rem;top:-4rem;width:16rem;height:16rem;border-radius:50%;background:var(--tangerine);animation:pulse 9s ease-in-out infinite}
.final .g2{position:absolute;right:-2.5rem;bottom:-3rem;width:14rem;height:14rem;border-radius:2.5rem;background:var(--mint);transform:rotate(12deg);animation:rot 12s ease-in-out infinite}
.final .g3{position:absolute;right:12%;top:2.5rem;display:none;width:0;height:0;border-left:3rem solid transparent;border-right:3rem solid transparent;border-bottom:5.2rem solid rgba(233,229,255,.8);animation:floaty 6s ease-in-out infinite}
@media(min-width:640px){.final .g3{display:block}}
@keyframes pulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(10deg)}}
@keyframes rot{0%,100%{transform:rotate(12deg)}50%{transform:rotate(32deg)}}
.final .in{position:relative;z-index:2;margin:0 auto;max-width:48rem}
.final h2{font-size:clamp(2.25rem,6vw,3.75rem);font-weight:700;line-height:1.05}
.final p.s{margin:1.5rem auto 0;max-width:36rem;font-size:clamp(1.1rem,2vw,1.25rem);color:rgba(255,253,246,.85)}
.final .cta-row{justify-content:center;align-items:stretch}@media(min-width:640px){.final .cta-row{align-items:center}}

/* footer */
footer{position:relative;overflow:hidden;background:var(--midnight);color:var(--ivory)}
.fgrid{position:relative;display:grid;gap:3rem;padding-block:4rem}
@media(min-width:768px){.fgrid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1024px){.fgrid{grid-template-columns:1.4fr 1fr 1fr 1.2fr}}
footer h3{margin-bottom:1rem;font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;font-weight:600;color:var(--mint)}
footer li a,footer li span.l{display:inline-flex;min-height:2.5rem;align-items:center;color:rgba(255,253,246,.8);text-decoration:none;transition:color .2s}

.fb{position:relative;border-top:1px solid rgba(255,253,246,.15)}
.fb .wrap{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:.75rem;padding-block:1.5rem;font-size:.875rem;color:rgba(255,253,246,.6)}
@media(min-width:640px){.fb .wrap{flex-direction:row;align-items:center}}

.soc{margin-top:1.25rem;display:flex;flex-wrap:wrap;gap:.5rem}

.soc a:hover{background:var(--ivory);color:var(--midnight)}

/* misc pages */
.page{padding:8rem 0 5rem;max-width:48rem}
.page h1{font-size:clamp(2.25rem,5vw,3rem);font-weight:700;color:var(--royal)}
.page .draft{margin-top:.75rem;border-radius:1rem;background:rgba(255,128,87,.2);padding:1rem;font-size:.875rem;font-weight:600;color:var(--royal)}

.nf{display:grid;place-items:center;min-height:80vh;padding:8rem 1.5rem 4rem;text-align:center}

.nf p.e{margin:1.25rem auto 0;max-width:28rem;font-size:1.125rem;color:rgba(16,26,53,.7)}

/* admin */
.adm-page{min-height:100vh;background:rgba(233,229,255,.4)}

.badge-admin{display:none;border-radius:9999px;background:var(--royal);padding:.25rem .75rem;font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ivory)}
@media(min-width:640px){.badge-admin{display:inline}}
.stats{margin-top:1.5rem;display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem}@media(min-width:1024px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border-radius:1.5rem;padding:1.25rem;text-align:left;transition:transform .2s}.stat:hover{transform:translateY(-4px)}
.stat.sel{box-shadow:0 0 0 4px rgba(23,43,103,.3)}
.stat .eyebrow{font-size:.65rem;opacity:.8;margin:0}.stat b{display:block;margin-top:.5rem;font-family:var(--display);font-size:2.25rem}
.toolbar{margin-top:2rem;display:flex;flex-direction:column;gap:.75rem}@media(min-width:640px){.toolbar{flex-direction:row;align-items:center}.toolbar .grow{flex:1}}
.pillinp{display:block;min-height:3rem;width:100%;border:2px solid rgba(23,43,103,.15);border-radius:9999px;background:var(--ivory);padding:0 1.25rem;font:inherit;outline:none}

.tbl{margin-top:1.5rem;overflow:hidden;border-radius:1.5rem;background:var(--ivory);box-shadow:0 0 0 1px rgba(23,43,103,.1)}

.mlist li{border-top:1px solid rgba(23,43,103,.1)}.mlist li:first-child{border:0}
.mlist button{display:flex;width:100%;align-items:flex-start;justify-content:space-between;gap:.75rem;padding:1.25rem;text-align:left}

.s-PENDING{background:rgba(255,128,87,.25);color:var(--danger-d)}.s-APPROVED{background:var(--mint);color:var(--royal)}.s-REJECTED{background:rgba(194,65,12,.15);color:var(--danger-d)}

.pager{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(23,43,103,.1);padding:1rem 1.25rem;font-size:.875rem}
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end}

@keyframes slideR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

@media(min-width:640px){.dl div{flex-direction:row;justify-content:space-between;gap:1.5rem}.dl dd{text-align:right}}
.dl dt{font-size:.875rem;font-weight:600;color:rgba(16,26,53,.55)}.dl dd{margin:0;word-break:break-word;font-weight:700;color:var(--royal)}
.dl a{color:var(--cobalt)}
.box2{border-radius:1rem;padding:1rem;font-size:.875rem}

}

.tp-role{margin:.85rem 0 0;font-size:1.1rem;color:rgba(16,26,53,.72)}

/* ───────────────────────── routing ───────────────────────── */
let pendingScroll = null;
function route() {
  const h = location.hash;
  if (h === "#/admin" || h.startsWith("#/admin/")) return "admin";
  if (h === "#/privacy") return "privacy";
  if (h === "#/terms") return "terms";
  if (h === "" || h === "#" || h === "#/") return "home";
  if (/^#[A-Za-z]/.test(h)) return "home";
  return "404";
}
function scrollToId(id) {
  const el = document.getElementById(id);
  if (!el) return false;
  el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  return true;
}
function goTo(id) {
  if (route() === "home") scrollToId(id);
  else { pendingScroll = id; location.hash = "#/"; }
}
window.addEventListener("hashchange", () => render());

/* ───────────────────────── reveal / observers ───────────────────────── */
let revealObs, navObs, countObs;
function setupObservers() {
  revealObs && revealObs.disconnect(); navObs && navObs.disconnect(); countObs && countObs.disconnect();
  revealObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); revealObs.unobserve(e.target); } }), { rootMargin: "0px 0px -80px 0px" });
  $$(".rv").forEach(el => revealObs.observe(el));

  countObs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    countObs.unobserve(e.target);
    e.target.closest(".node")?.classList.add("in");
    const to = +e.target.dataset.count, el = e.target;
    if (reduceMotion) { el.textContent = String(to).padStart(2, "0"); return; }
    const t0 = performance.now();
    (function tick(t) {
      const p = Math.min(1, (t - t0) / 1100);
      el.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 2)))).padStart(2, "0");
      if (p < 1) requestAnimationFrame(tick);
    })(t0);
  }), { rootMargin: "0px 0px -60px 0px" });
  $$("[data-count]").forEach(el => countObs.observe(el));

  if (route() === "home") {
    const ids = ["about","programmes","why","journey","results","faq","admission"];
    navObs = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      $$("[data-nav]").forEach(a => { const on = a.dataset.nav === e.target.id; a.classList.toggle("on", on); on ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"); });
    }), { rootMargin: "-40% 0px -55% 0px" });
    ids.forEach(id => { const el = document.getElementById(id); el && navObs.observe(el); });
  }
}
function onScroll() {
  const nav = $("#nav"); if (nav) nav.classList.toggle("solid", scrollY > 24 || $("#mmenu")?.classList.contains("open"));
  const list = $("#jlist"), fill = $("#railfill");
  if (list && fill) {
    const r = list.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (innerHeight * 0.65 - r.top) / r.height));
    fill.style.height = (reduceMotion ? 100 : p * 100) + "%";
  }
}
window.addEventListener("scroll", onScroll, { passive: true });

  return `<header id="nav"><nav class="wrap bar" aria-label="Main navigation">
    <a href="#/" data-top aria-label="MATHLETICS home">${lockup()}</a>
    <ul class="navlinks">${NAV.map(([id, l]) => `<li><a href="#${id}" data-go="${id}" data-nav="${id}">${l}</a></li>`).join("")}</ul>
    <div class="navright">
      <a href="#admission" data-go="admission" class="btn btn-tang btn-sm">Apply</a>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="mmenu" aria-label="Open menu">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div></nav>
  </header>
  <div id="mmenu"><ul class="wrap">${[...NAV, ["admission","Admission"]].map(([id, l], i) => `<li><a href="#${id}" data-go="${id}" data-nav="${id}" style="animation-delay:${i * .05}s">${l}<span>→</span></a></li>`).join("")}</ul></div>`;
}

function hero() {
  const fcs = [
    ["a² + b² = c²", "left:-2%;top:10%;background:var(--ivory);color:var(--royal)", 0],
    ["∫ f(x) dx", "right:-2%;top:22%;background:var(--mint);color:var(--royal)", .6],
    ["sin²θ + cos²θ = 1", "left:2%;bottom:16%;background:var(--lavender);color:var(--royal)", 1.2],
    ["π r²", "right:4%;bottom:8%;background:var(--tangerine);color:var(--midnight)", 1.8]
  ];
  return `<section id="top" class="grain"><div class="blob" aria-hidden="true"></div>
  <div class="wrap hero-grid">
    <div>
      <p class="eyebrow c-cobalt anim-in" style="--d:.1s">Coaching · Concepts · Confidence</p>
      <h1 class="anim-in" style="--d:.2s">Think Beyond <span class="serif c-cobalt">Numbers.</span><br>Achieve Beyond <span class="u">Limits.<svg viewBox="0 0 200 12" fill="none" aria-hidden="true"><path d="M3 8c40-7 90-7 194-2" stroke="#315FE8" stroke-width="4" stroke-linecap="round"/></svg></span></h1>
      <p class="lead anim-in" style="--d:.4s">Mathematics and Physics coaching in Sambalpur, building stronger concepts, sharper minds and brighter academic futures.</p>
      <div class="cta-row anim-in" style="--d:.55s">
        <a href="#about" data-go="about" class="btn btn-cobalt">Explore MATHLETICS ${arrow()}</a>
        <a href="#admission" data-go="admission" data-enquire class="btn btn-tang">Apply for Admission</a>
      </div>
      <ul class="trust anim-in" style="--d:.7s"><li><i></i>Concept-based learning</li><li><i></i>Personal attention</li><li><i></i>Regular assessment</li></ul>
    </div>
    <div class="hv" aria-hidden="true">
      <div class="bg dot-grid"></div>
      <svg class="geo" viewBox="0 0 500 500">
        <g stroke="#172B67" stroke-opacity=".35" stroke-width="1.5"><line x1="40" y1="250" x2="460" y2="250"/><line x1="250" y1="40" x2="250" y2="460"/></g>
        <g class="spin-slow" style="transform-origin:250px 250px"><circle cx="250" cy="250" r="170" fill="none" stroke="#315FE8" stroke-width="2.5" stroke-dasharray="4 10" stroke-linecap="round"/><circle cx="250" cy="80" r="9" fill="#FF8057"/></g>
        <g class="spin-slower" style="transform-origin:250px 250px"><circle cx="250" cy="250" r="125" fill="none" stroke="#172B67" stroke-opacity=".5" stroke-width="1.5"/><circle cx="375" cy="250" r="7" fill="#315FE8"/></g>
        <path d="M290 250a40 40 0 0 0-12-28" fill="none" stroke="#FF8057" stroke-width="3" stroke-linecap="round"/>
        <polygon points="70,420 120,340 170,420" fill="#B8E8D1" opacity=".9"/>
        <rect x="372" y="60" width="64" height="64" rx="14" fill="#FF8057" opacity=".95" transform="rotate(14 404 92)"/>
      </svg>
      <div class="big">${mMark(230)}</div>
      ${fcs.map(([t, st, d]) => `<div class="fc" style="${st};--d:${d}s">${t}</div>`).join("")}
    </div>
  </div>
  <button class="scrollind" data-go="about" aria-label="Scroll to About section"><span class="eyebrow">Scroll</span><span class="m"><i></i></span></button>
  </section>`;
}

/* ───────────────────────── admission form ───────────────────────── */
const STEPS = ["Student", "Academic", "Contact", "Submit"];
const LIMITS = { name: 80, message: 1000, email: 254 };
const NAME_RE = /^[\p{L}\p{M}][\p{L}\p{M}\s.'’-]{1,79}$/u;
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const MOBILE_RE = /^[6-9]\d{9}$/;
function normalizeMobile(raw) {
  const d = String(raw).replace(/[\s\-().]/g, "");
  if (/^\+91\d{10}$/.test(d)) return d.slice(3);
  if (/^0091\d{10}$/.test(d)) return d.slice(4);
  if (/^91\d{10}$/.test(d)) return d.slice(2);
  if (/^0\d{10}$/.test(d)) return d.slice(1);
  return d;
}
const FIELD_STEP = { studentName: 0, parentName: 0, currentClass: 0, subjects: 1, learningMode: 1, message: 1, mobile: 2, email: 2, consent: 3, website: 3 };
const emptyForm = () => ({ studentName: "", parentName: "", currentClass: "", subjects: [], learningMode: "", message: "", mobile: "", email: "", consent: false, website: "" });
const F = { step: 0, dir: 1, v: emptyForm(), err: {}, status: "idle", serverError: "", code: "", programme: "", lock: false, key: uuid(), t0: Date.now() };

function validateStep(step, v) {
  const e = {};
  if (step === 0) {
    if (!v.studentName.trim()) e.studentName = "Please enter the student's full name.";
    else if (!NAME_RE.test(v.studentName.trim())) e.studentName = "Use letters only (2–80 characters) for the name.";
    if (!v.parentName.trim()) e.parentName = "Please enter the parent or guardian's name.";
    else if (!NAME_RE.test(v.parentName.trim())) e.parentName = "Use letters only (2–80 characters) for the name.";
    if (!v.currentClass) e.currentClass = "Please select the student's current class.";
  }
  if (step === 1) {
    if (v.subjects.length === 0) e.subjects = "Select at least one subject of interest.";
    if (v.message.length > LIMITS.message) e.message = `Please keep your message under ${LIMITS.message} characters.`;
  }
  if (step === 2) {
    if (!v.mobile.trim()) e.mobile = "Please enter a mobile number.";
    else if (!MOBILE_RE.test(normalizeMobile(v.mobile))) e.mobile = "Enter a valid 10-digit Indian mobile number (starts with 6–9).";
    if (!v.email.trim()) e.email = "Please enter an email address.";
    else if (!EMAIL_RE.test(v.email.trim()) || v.email.length > LIMITS.email) e.email = "Enter a valid email address, e.g. name@example.com.";
  }
  if (step === 3 && !v.consent) e.consent = "Please tick the consent box to continue.";
  return e;
}
const validateAll = v => Object.assign({}, validateStep(0, v), validateStep(1, v), validateStep(2, v), validateStep(3, v));

  const form = $("#aform");

  $("#fback") && ($("#fback").onclick = () => { F.dir = -1; F.step = Math.max(0, F.step - 1); renderForm(); });

/* Direct e-mail mode (no database): used when no Supabase backend is configured but a Web3Forms access key is set.
   Sends the enquiry to the coaching team's inbox. The key is public by design (it can only send to its owner's verified e-mail). */
async function submitDirect(key) {
  if (F.v.website) { F.code = "MATH-" + Date.now().toString(36).toUpperCase(); F.status = "success"; renderForm(); return; }   // honeypot: bots see "success", nothing is sent
  const code = "MATH-" + new Date().toISOString().slice(2, 10).replace(/-/g, "") + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
  const v = F.v;
  const lines = [`Reference: ${code}`, `Student: ${v.studentName.trim()}`, `Parent/guardian: ${v.parentName.trim()}`, `Class: ${v.currentClass}`, `Subjects: ${v.subjects.join(", ")}`,
    `Learning mode: ${v.learningMode || "No preference"}`, `Mobile: ${normalizeMobile(v.mobile)}`, `Email: ${v.email.trim()}`, F.programme ? `Enquiring about: ${F.programme}` : "", v.message.trim() ? `Message: ${v.message.trim()}` : "", "Consent given to be contacted: yes"].filter(Boolean);
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 25000); let res, body = {};
  try {
    res = await fetch("https://api.web3forms.com/submit", { method: "POST", signal: ctrl.signal, headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ access_key: key, subject: `NEW ADMISSION ENQUIRY — MATHLETICS (${code})`, from_name: "MATHLETICS website", name: v.studentName.trim(), email: v.email.trim(), phone: normalizeMobile(v.mobile), message: lines.join("\n") }) });
    try { body = await res.json(); } catch {}
  } catch { F.callHelp = true; throw new Error(REACH_ERR()); }
  finally { clearTimeout(to); }
  if (!res.ok || !body.success) { F.callHelp = true; throw new Error("We could not send your enquiry right now. Please try again in a moment, or call us."); }
  F.code = code; F.status = "success"; renderForm();
}

const IN_FRAME = (() => { try { return window.self !== window.top; } catch { return true; } })();
const REACH_ERR = () => IN_FRAME
  ? "This page is running inside a preview window that blocks connections to outside services, so your enquiry was NOT sent. Open the live website (not the preview) to submit, or call us."
  : "We could not reach the enquiry service. Please check your connection and try again, or call us.";
const NOTIFY_EMAIL = CONFIG.NOTIFY_EMAIL || "pradyumnakishorrath@gmail.com";

/* Default e-mail delivery: FormSubmit.co (a form-to-email service, no API key). The owner confirms the address ONCE by clicking the activation link FormSubmit e-mails on the first submission. */
async function submitFormSubmit() {
  if (F.v.website) { F.code = "MATH-" + Date.now().toString(36).toUpperCase(); F.status = "success"; renderForm(); return; }   // honeypot: bots see "success", nothing is sent
  const code = "MATH-" + new Date().toISOString().slice(2, 10).replace(/-/g, "") + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
  const v = F.v, to = NOTIFY_EMAIL;
  const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), 25000); let res, body = {};
  try {
    res = await fetch("https://formsubmit.co/ajax/" + encodeURIComponent(to), { method: "POST", signal: ctrl.signal, headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ _subject: `NEW ADMISSION ENQUIRY — MATHLETICS (${code}) — ${v.studentName.trim()}`, _template: "table", _captcha: "false", _replyto: v.email.trim(),
        "Reference": code, "Student name": v.studentName.trim(), "Parent / guardian name": v.parentName.trim(), "Current class": v.currentClass, "Subjects": v.subjects.join(", "),
        "Learning mode": v.learningMode || "No preference", "Selected programme": F.programme || "Not specified", "Mobile": normalizeMobile(v.mobile), "email": v.email.trim(),
        "Message": v.message.trim() || "-", "Consent to be contacted": "Yes", "Submitted": new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }) + " IST" }) });
    try { body = await res.json(); } catch {}
  } catch { F.callHelp = true; throw new Error(REACH_ERR()); }
  finally { clearTimeout(tm); }
  if (!res.ok || !(body.success === true || body.success === "true")) { F.callHelp = true; throw new Error("We could not send your enquiry right now. Please try again in a moment, or call us."); }
  F.code = code; F.status = "success"; renderForm();
}

async function submitForm() {
  if (F.lock || F.status === "submitting") return;       // duplicate-click protection
  const all = validateAll(F.v);
  if (Object.keys(all).length) {
    F.err = all; const first = Math.min(...Object.keys(all).map(k => FIELD_STEP[k]));
    F.dir = first < F.step ? -1 : 1; F.step = first; renderForm(); focusFirstError(); return;
  }
  F.lock = true; F.status = "submitting"; F.serverError = ""; renderForm();
  try {
    if (!CONFIGURED && !CONFIG.ENQUIRY_API && CONFIG.FORM_ACCESS_KEY) { await submitDirect(CONFIG.FORM_ACCESS_KEY); return; }
    if (!CONFIGURED && !CONFIG.ENQUIRY_API) { await submitFormSubmit(); return; }
    const message = [F.programme ? `[Enquiring about: ${F.programme}]` : "", F.v.message.trim()].filter(Boolean).join("\n");
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 25000);
    let res;
    try {
      res = await fetch(CONFIG.ENQUIRY_API || `${CONFIG.SUPABASE_URL}/functions/v1/submit-enquiry`, {
        method: "POST", signal: ctrl.signal,
        headers: CONFIG.ENQUIRY_API ? { "Content-Type": "application/json" } : { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}` },
        body: JSON.stringify({
          studentName: F.v.studentName.trim(), parentName: F.v.parentName.trim(), currentClass: F.v.currentClass, subjects: F.v.subjects,
          learningMode: F.v.learningMode, message, mobile: normalizeMobile(F.v.mobile), email: F.v.email.trim(), consent: F.v.consent,
          website: F.v.website, idempotencyKey: F.key, elapsedMs: Date.now() - F.t0
        })
      });
    } catch { if (CONFIG.ENQUIRY_API) { await submitFormSubmit(); return; } throw new Error("We could not reach the admissions service. Please check your connection and try again."); }
    finally { clearTimeout(to); }
    let body = {}; try { body = await res.json(); } catch {}
    if (CONFIG.ENQUIRY_API && [404, 405, 501, 503].includes(res.status)) { await submitFormSubmit(); return; }   // endpoint not deployed on this host -> use the e-mail service
    if (!res.ok) {
      if (body.fieldErrors && Object.keys(body.fieldErrors).length) {
        F.err = body.fieldErrors; F.dir = -1; F.step = Math.min(...Object.keys(body.fieldErrors).map(k => FIELD_STEP[k] ?? 0));
      }
      throw new Error(body.error || "We could not submit your enquiry. Please check the details and try again.");
    }
    if (!body.ok || !body.enquiryCode) throw new Error("Unexpected response from the server. Please try again.");
    F.code = body.enquiryCode; F.status = "success"; renderForm();   // lock stays engaged for this form instance
  } catch (err) {
    F.lock = false; F.status = "error";
    F.serverError = err.message || "Something went wrong. Please try again.";
    renderForm(); if (Object.keys(F.err).length) focusFirstError();
  }
}

const SKEY = "mathletics-admin-session";
const A = { session: null, gate: "loading", rows: [], total: 0, counts: null, status: "ALL", search: "", page: 0, loading: false, error: "", sel: null, loginErr: "", busy: false };

function loadSession() { try { return JSON.parse(store.get(SKEY) || "null"); } catch { return null; } }
function saveSession(s) { A.session = s; s ? store.set(SKEY, JSON.stringify(s)) : store.del(SKEY); }
function toSession(j) { return { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: j.user }; }

async function refreshSession() {
  if (!A.session?.refresh_token) return false;
  try {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: { "Content-Type": "application/json", apikey: CONFIG.SUPABASE_ANON_KEY }, body: JSON.stringify({ refresh_token: A.session.refresh_token }) });
    if (!r.ok) return false;
    saveSession(toSession(await r.json())); return true;
  } catch { return false; }
}
async function api(path, { method = "GET", body, headers = {}, raw = false } = {}, retry = true) {
  if (A.session && A.session.expires_at - Date.now() < 30000 && retry) await refreshSession();
  const res = await fetch(`${CONFIG.SUPABASE_URL}${path}`, {
    method, body: body ? JSON.stringify(body) : undefined,
    headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: `Bearer ${A.session?.access_token || CONFIG.SUPABASE_ANON_KEY}`, ...(body ? { "Content-Type": "application/json" } : {}), ...headers }
  });
  if (res.status === 401 && retry && (await refreshSession())) return api(path, { method, body, headers, raw }, false);
  return res;
}

  if (!CONFIGURED) { A.gate = "signed-out"; return renderAdmin(); }
  A.session = loadSession();

  try {
    const r = await api(`/rest/v1/admins?select=user_id&user_id=eq.${encodeURIComponent(A.session.user.id)}`);
    if (r.status === 401) { saveSession(null); A.gate = "signed-out"; return renderAdmin(); }
    const rows = r.ok ? await r.json() : [];
    A.gate = rows.length ? "admin" : "not-admin";
  } catch { A.gate = "signed-out"; A.loginErr = "Could not reach the server."; }
  renderAdmin();
  if (A.gate === "admin") { loadCounts(); loadRows(); }

(function () {
  if (!window.matchMedia || !matchMedia("(hover:hover) and (pointer:fine)").matches) return;
  var root = document.documentElement, rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var dot, ring, x = -100, y = -100, rx = -100, ry = -100, on = false, raf = 0;
  var LINK = "a[href],button,select,summary,[role=button],[role=tab],[role=checkbox],label[for],.chip,[data-more],[data-enq]";
  var TEXT = "input:not([type=checkbox]):not([type=radio]):not([type=submit]):not([type=button]),textarea,[contenteditable]";
  function init() {
    dot = document.createElement("div"); dot.className = "cur-dot"; ring = document.createElement("div"); ring.className = "cur-ring";

    on = true; root.classList.add("cur-on"); loop();

    raf = requestAnimationFrame(loop);
  }
  addEventListener("mousemove", function (e) {
    x = e.clientX; y = e.clientY;
    if (!on) { rx = x; ry = y; init(); }
    root.classList.remove("cur-out");
    var t = e.target && e.target.closest ? e.target : null;
    root.classList.toggle("cur-text", !!(t && t.closest(TEXT)));
    root.classList.toggle("cur-link", !!(t && !t.closest(TEXT) && t.closest(LINK)));
  }, { passive: true });
  addEventListener("mousedown", function () { root.classList.add("cur-down"); });
  addEventListener("mouseup", function () { root.classList.remove("cur-down"); });
  document.addEventListener("mouseleave", function () { root.classList.add("cur-out"); });
  document.addEventListener("mouseenter", function () { root.classList.remove("cur-out"); });
})();
</script>
